name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  frontend-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate scripts
        run: |
          bash -n scripts/*.sh doc/system/*.sh
          python3 -m py_compile scripts/*.py
      - name: Validate authority contract
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          python3 -c 'import yaml; yaml.safe_load(open("contracts/authority/zfss-authority.v1.yaml", encoding="utf-8"))'
      - name: Rebuild canonical system document
        run: |
          bash doc/system/BUILD.sh
          git diff --exit-code -- doc/ZFSSYSTEM.md
          test ! -e SYSTEM.md
          test ! -e doc/SYSTEM.md
          test ! -e doc/zsSYSTEM.md
      - name: Reject superseded authority claims
        run: |
          if grep -R -n -E 'single source of truth|sole authoritative|no cloud authority|authoritative source of truth|only writable DataForgeDB|No test suite yet|No CI/CD pipeline|Repository and service modules are stubs' \
            README.md CLAUDE.md doc/ZFSSYSTEM.md doc/system src-tauri/src contracts; then
            echo 'Superseded authority language found in a canonical surface' >&2
            exit 1
          fi
      - name: Reject canonical repository mutations
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          source = pathlib.Path("src-tauri/src/repository/mod.rs").read_text(encoding="utf-8")
          mutation = re.search(r"\b(?:UPDATE|DELETE\s+FROM)\s+(?:issues|signals|decisions|artifacts|responses)\b", source, re.IGNORECASE)
          if mutation:
              raise SystemExit(f"canonical mutation statement found: {mutation.group(0)}")
          PY

  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zfss_rust_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zfss_rust_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZFSS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zfss_rust_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build Tauri frontend prerequisite
        run: |
          npm ci
          npm run build
      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Apply repository test migrations
        run: |
          for migration in migrations/*.sql; do
            psql "$ZFSS_TEST_DATABASE_URL" --set ON_ERROR_STOP=1 --file "$migration"
          done
      # ZFSS does not yet commit src-tauri/Cargo.lock. Do not use --locked until
      # a separately generated and reviewed application lockfile is admitted.
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zfss_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zfss_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGURL: postgresql://postgres:postgres@localhost:5432/zfss_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        run: |
          for migration in migrations/*.sql; do
            psql "$PGURL" --set ON_ERROR_STOP=1 --file "$migration"
          done
      - name: Verify append-only PostgreSQL contract
        run: psql "$PGURL" --file tests/postgres_contract.sql
